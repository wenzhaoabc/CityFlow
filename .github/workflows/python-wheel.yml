name: Build Python wheel

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  linux-wheel:
    name: Python 3.12 Linux wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pypa/cibuildwheel@v2.23.1
        env:
          CIBW_BUILD: cp312-manylinux_x86_64
          CIBW_BUILD_VERBOSITY: 1
          CIBW_TEST_COMMAND: >-
            python -c "import cityflow; print(cityflow.__version__)"

      - name: Store wheel in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: cityflow-python312-linux-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 90

  python-tests:
    name: Python 3.12 regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CityFlow
        run: python -m pip install .

      - name: Run Python tests
        run: python -m unittest discover -v -s tests/python

  release-wheel:
    name: Publish Python 3.12 wheel release
    needs:
      - linux-wheel
      - python-tests
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: cityflow-python312-linux-wheel
          path: wheelhouse

      - name: Update rolling Python 3.12 tag
        if: github.ref == 'refs/heads/master'
        run: |
          git tag -f python312-latest "$GITHUB_SHA"
          git push origin refs/tags/python312-latest --force

      - name: Publish rolling Python 3.12 wheel release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python312-latest
          name: CityFlow Python 3.12 Linux wheel (latest)
          body: |
            Rolling CPython 3.12 Linux wheel built from the latest tested `master` commit.

            Source commit: `${{ github.sha }}`

            Install by downloading the `.whl` asset below and running:
            `pip install <downloaded-wheel.whl>`
          files: wheelhouse/*.whl
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true

      - name: Publish versioned wheel release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wheelhouse/*.whl
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
